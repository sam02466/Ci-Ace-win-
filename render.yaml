services:
  - type: web
    name: acebackend-account-extensions
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acebackend-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEV_OTP_ENABLED
        value: "false"
databases:
  - name: acebackend-db
    plan: basic-256mb
