name: backend-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      
      - name: List directory contents (Debug step)
        run: ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npx prisma generate

      - name: Typecheck
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npm run typecheck

      - name: Migrate Database
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npx prisma migrate deploy

      - name: Run Tests
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npm run test:unit && npx vitest run tests/account-extension-contract.test.ts

      - name: Build
        working-directory: YOUR_EXACT_FOLDER_NAME_HERE
        run: npm run build
